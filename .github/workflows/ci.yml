name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Engine, clippy, bindings
        run: |
          set -o pipefail
          {
            echo "== cargo test (engine)"
            cargo test -p veritas-core --all-targets
            echo "== cargo clippy (engine, warnings are errors)"
            cargo clippy -p veritas-core --all-targets -- -D warnings
            echo "== cargo build (python extension)"
            cargo build --release -p veritas-py
            echo "== cargo build (wasm inspector)"
            cargo build -p veritas-wasm --target wasm32-unknown-unknown
          } 2>&1 | tee /tmp/rust.log
      - name: Annotate the first diagnostics
        if: failure()
        run: |
          grep -E "(^error(\[E[0-9]+\])?:|^ +--> |panicked at|^---- |^failures:|^test .* FAILED|assertion)" /tmp/rust.log \
            | head -12 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Report diagnostics on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: /tmp/rust.log
        run: |
          python3 - <<'PY' > /tmp/payload.json || true
          import json, os
          path = os.environ.get("LOG", "/tmp/rust.log")
          try:
              text = open(path, errors="replace").read()
          except OSError:
              text = "no log captured"
          head = text[:30000]
          tail = text[-30000:] if len(text) > 30000 else ""
          body = "Rust job diagnostics:\n```\n" + head
          if tail:
              body += "\n...[truncated]...\n" + tail
          body += "\n```"
          print(json.dumps({"body": body[:60000]}))
          PY
          gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --input /tmp/payload.json
  native:
    name: native extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build, install and exercise the extension
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip maturin
            maturin build --release --manifest-path crates/veritas-py/Cargo.toml -o dist
            # A fresh venv keeps the two distributions apart: the wheel provides the
            # ``veritas_py`` extension module, while ``PYTHONPATH=python`` provides the pure
            # Python package (pip would otherwise uninstall one as a rename of the other).
            python -m venv /tmp/native-venv
            /tmp/native-venv/bin/python -m pip install --upgrade pip pytest pydantic jsonschema hypothesis sqlglot
            /tmp/native-venv/bin/python -m pip install --no-deps dist/*.whl
            PYTHONPATH="$PWD/python" /tmp/native-venv/bin/python -c "import veritas, veritas.native as n; assert n.available(), n.load_error(); print(veritas.doctor())"
            # With veritas_py importable this runs the whole suite *through* the native
            # masks and prefixes, including the 38 parity cases that skip otherwise.
            PYTHONPATH="$PWD/python" /tmp/native-venv/bin/python -m pytest tests/ -q
            # Same call sites twice: with the extension, then with it disabled. Informational
            # only - a shared runner is not a place to gate on wall-clock numbers.
            echo "== native vs pure A/B"
            PYTHONPATH="$PWD/python" /tmp/native-venv/bin/python benchmarks/native_speedup.py
            echo "== end A/B"
          } 2>&1 | tee /tmp/native.log
      - name: Publish the A/B measurement
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: /tmp/native.log
        run: |
          python3 - <<'PY' > /tmp/bench.json || true
          import json, os, re
          try:
              text = open(os.environ.get("LOG", ""), errors="replace").read()
          except OSError:
              text = ""
          match = re.search(r"== native vs pure A/B\n(.*?)== end A/B", text, re.S)
          table = match.group(1).strip() if match else "benchmark output was not captured"
          body = (
              "Native engine A/B, measured on this run (informational; CI timings vary):\n```\n"
              + table[:6000]
              + "\n```\nReproduce locally with `python benchmarks/native_speedup.py`."
          )
          print(json.dumps({"body": body}))
          PY
          gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --input /tmp/bench.json
      - name: Report diagnostics on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: /tmp/native.log
        run: |
          python3 - <<'PY' > /tmp/payload.json || true
          import json, os
          path = os.environ.get("LOG", "/tmp/native.log")
          try:
              text = open(path, errors="replace").read()
          except OSError:
              text = "no log captured"
          head = text[:30000]
          tail = text[-30000:] if len(text) > 30000 else ""
          body = "Native extension diagnostics:\n```\n" + head
          if tail:
              body += "\n...[truncated]...\n" + tail
          body += "\n```"
          print(json.dumps({"body": body[:60000]}))
          PY
          gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --input /tmp/payload.json

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,z3]"
      - run: ruff check python tests benchmarks
      - run: pytest tests/
      - run: python -m build --wheel -o dist
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: veritas --help
