name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Engine, clippy, bindings
        run: |
          set -o pipefail
          {
            echo "== cargo test (engine)"
            cargo test -p veritas-core --all-targets
            echo "== cargo clippy (engine, warnings are errors)"
            cargo clippy -p veritas-core --all-targets -- -D warnings
            echo "== cargo build (python extension)"
            cargo build --release -p veritas-py
            echo "== cargo build (wasm inspector)"
            cargo build -p veritas-wasm --target wasm32-unknown-unknown
          } 2>&1 | tee /tmp/rust.log
      - name: Annotate the first diagnostics
        if: failure()
        run: |
          grep -E "(^error(\[E[0-9]+\])?:|^ +--> |panicked at|^---- |^failures:|^test .* FAILED|assertion)" /tmp/rust.log \
            | head -12 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Report diagnostics on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/payload.json || true
          import json
          text = ""
          try:
              text = open("/tmp/rust.log", errors="replace").read()
          except OSError:
              text = "no log captured"
          head = text[:30000]
          tail = text[-30000:] if len(text) > 30000 else ""
          body = "Rust job diagnostics:\n```\n" + head
          if tail:
              body += "\n...[truncated]...\n" + tail
          body += "\n```"
          print(json.dumps({"body": body[:60000]}))
          PY
          gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --input /tmp/payload.json
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,z3]"
      - run: ruff check python tests benchmarks
      - run: pytest tests/
      - run: python -m build --wheel -o dist
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: veritas --help
