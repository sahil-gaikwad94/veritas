name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    name: rust (${{ matrix.build }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [engine, bindings]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests
        if: matrix.build == 'engine'
        run: cargo test -p veritas-core --all-targets
      - name: Engine clippy
        if: matrix.build == 'engine'
        run: cargo clippy -p veritas-core --all-targets -- -D warnings
      - name: Python extension
        if: matrix.build == 'bindings'
        run: cargo build --release -p veritas-py
      - name: Wasm inspector
        if: matrix.build == 'bindings'
        run: cargo build -p veritas-wasm --target wasm32-unknown-unknown
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,z3]"
      - run: ruff check python tests benchmarks
      - run: pytest tests/
      - run: python -m build --wheel -o dist
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: veritas --help
