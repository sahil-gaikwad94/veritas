[workspace]
members = [
    "crates/veritas-core",
    "crates/veritas-py",
    "crates/veritas-wasm",
]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["veritas contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
maturin = "1"
