[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "veritas-ai"
version = "2.0.0"
description = "Neuro-symbolic solver-guided decoding and formal verification engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
z3 = ["z3-solver>=4.13"]
cas = ["sympy>=1.12", "numpy>=1.26"]
rl = ["datasets>=2.0", "transformers>=4.40"]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "veritas._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
